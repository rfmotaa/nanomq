Configuration:
  status: WARN

  Appenders:
    Console:
      name: LogToConsole
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"

    RollingFile:
      name: LogToFile
      fileName: logs/app.log
      filePattern: "logs/app-%d{yyyy-MM-dd}-%i.log.gz"
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n"
      Policies:
        TimeBasedTriggeringPolicy:
          interval: 1
          modulate: true
        SizeBasedTriggeringPolicy:
          size: "10MB"
      DefaultRolloverStrategy:
        max: 10

  Loggers:
    Root:
      level: INFO
      AppenderRef:
        - ref: LogToConsole
        - ref: LogToFile
